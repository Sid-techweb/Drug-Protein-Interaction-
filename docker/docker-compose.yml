version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: helixq_postgres
    environment:
      POSTGRES_USER: helixq_admin
      POSTGRES_PASSWORD: helixq_secure_pass
      POSTGRES_DB: helixq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helixq_admin -d helixq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: helixq_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: helixq_backend
    environment:
      - DATABASE_URL=postgresql://helixq_admin:helixq_secure_pass@postgres:5432/helixq_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: helixq_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
