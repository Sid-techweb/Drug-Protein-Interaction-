version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: helixq-postgres
    environment:
      POSTGRES_DB: helixq_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helixq-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/helixq_db
      - ENVIRONMENT=production
      - JWT_SECRET_KEY=helixq_super_secret_enterprise_jwt_signing_key_production_2026
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: helixq-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
